map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker DNS: web and api get new IPs on every rebuild, so re-resolve them
resolver 127.0.0.11 valid=10s ipv6=off;

upstream web {
    zone web 64k;
    server web:3000 resolve;
}

upstream api {
    zone api 64k;
    server api:4000 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;
    # nginx answers 413 itself in /api/ and /socket too, where no security headers are added
    error_page 413 @payload_too_large;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api;
    }

    location /socket {
        proxy_pass http://api;
        # Any proxy_set_header here drops the server-level ones, so the client IP
        # headers are repeated for the per-IP connection limit in the API.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # A refused handshake (403, 429) must not leave an idle keepalive connection behind.
        keepalive_timeout 0;
    }

    # Only the web app: the API sets its own security headers through Helmet.
    # Full CSP is left out until Next scripts get nonces.
    location / {
        proxy_pass http://web;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location @payload_too_large {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        return 413;
    }
}
